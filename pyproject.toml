[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pwlint"
version = "1.0.0"
description = "Judge a password honestly and generate strong ones, offline. Never prints or sends the password. No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["passwords", "password-strength", "security", "generator", "privacy"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/pwlint"

[project.scripts]
pwlint = "pwlint:main"

[tool.setuptools]
py-modules = ["pwlint"]
